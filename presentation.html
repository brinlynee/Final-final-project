## Mean Discharge Rates vs Patient Rates by Age Group

&lt;img src="presentation_files/figure-html/unnamed-chunk-4-1.png" alt="" width="75%" style="display: block; margin: auto;" /&gt;
- Discharge rates and patient rates show a weak negative relationship.
- Patient rates are highest for ages 65+ and lowest for ages 0–17.

---



*Skewness
- Most groups are right-skewed, with some high-value outliers.

*IQR / Min / Max
- The 25–39 age group has the largest IQR.
- Males have a larger IQR than females.
- SIMD 1 has higher patient rates than SIMD 5.

*Prediction for Regression
- We expect age, sex and discharge rates to be related to patient rates.
- Older age groups and males may have higher patient rates.

*Scatter Plot Trend
- X (Independent variable): Mean Discharge Rates
- Y(Dependent variable): Patient Rates
- The regression line is almost flat, with a slight downward trend.
- As discharge rates increase, patient rates show little overall change.

#Methodology

Regression Model:

`$$\begin{aligned} \text{PatientsRates}_{t} &amp;= \alpha + \beta_1 \cdot \text{DeprivationGap}_{t} \\ &amp;\quad + \beta_2 \cdot \text{DischargeRates}_{t} \\ &amp;\quad + \beta_3 \cdot \text{AgeGroup}_{t} + \beta_4 \cdot \text{Sex}_{t} \end{aligned}$$`









Alpha (α):
Represents the intercept of the regression model. It is the expected value of the dependent variable at time t when all independent variables are equal to zero.

Beta（β₁ to β₄）：
Represent the regression coefficients (or marginal effects).β₁ to β₄ measure the expected change in the dependent variable for a one-unit change in the corresponding independent variable at time 
t, holding all other variables constant.

t (Time subscript):
Represents the specific time period (e.g., a specific Financial Year) for which the observation is recorded. The subscript t indicates that the variables are measured at a specific point in time, meaning this is time-series or panel data.

Error term (ε_t):
Represents the residual variance at time t. It captures the unobserved factors, random shocks, or measurement errors that affect the dependent variable at that specific time period but are not included in the model.

The deprivation gap coefficient is negative (-0.3681), meaning that for every one-unit increase in the discharge-rate gap between SIMD 1 and SIMD 5, the patient rate decreases by approximately 0.3681, holding other variables constant. The p-value of 7.59e-05 indicates that this result is statistically significant at the 0.1% level (p &lt; 0.001).

The coefficient for DischargeRates is positive (0.3218). This indicates a positive relationship: for every one-unit increase in discharge rates, the patient rate increases by approximately 0.3218. The p-value of 0.00392 is less than 0.01, demonstrating statistical significance at the 1% level.

The coefficients for the AgeGroup are all positive and highly significant compared to the reference group (0-17 years). Specifically, the 18-24 years group shows an increase of 291.7250 (p &lt; 0.001), the 25-39 years group shows an increase of 459.1557 (p &lt; 0.001), the 40-64 years group shows an increase of 431.8691 (p &lt; 0.001), and the 65plus years group has the highest increase of 797.5376 (p &lt; 0.001). All age-related results are statistically significant at the 0.1% level.

The coefficient for SexMale is positive (105.4133). This indicates that, compared to the reference group (females), the male patient rate is higher by 105.4133. The p-value of &lt; 2e-16 indicates that this gender difference is statistically significant at the 0.1% level.

## Residual Diagnostics for the Multiple Linear Regression Model

---
Residual Diagnostics of the Multiple Linear Regression Model

The diagnostic plots assess the multiple linear regression model using deprivation gap, mean discharge rates, age group, and sex as explanatory 
variables.

Residuals vs Fitted Plot：
Most residuals are distributed around the zero line. However, the red line shows some fluctuations and is not completely horizontal. There are also some relatively large residuals. This suggests that the model may not fully capture the linear relationship between the variables.

Normal Q-Q Plot：
Most points follow the general pattern of the reference line. However, several points deviate from the line, especially in the upper tail. This suggests that the residuals may not fully follow a normal distribution.

Scale-Location Plot：
The red line shows a slight upward trend, especially at higher fitted values. The spread of the points is not completely consistent across the fitted values. This suggests that the model may have a heteroscedasticity problem, meaning that the error variance is not constant. HC3 robust standard errors can help improve the reliability of statistical inference.

Residuals vs Leverage Plot：
Most observations are clustered within a similar leverage range. However, a few observations have relatively higher leverage or larger standardized residuals. These observations may influence the model, so they should be further examined using Cook's Distance.

Overall Conclusion：
Overall, the multiple linear regression model examines the associations between PatientsRates and deprivation gap, mean discharge rates, age group, and sex. The Residuals vs Fitted Plot shows some fluctuations, suggesting that the model may not fully capture the relationship between the variables. The Normal Q-Q Plot indicates that some residuals deviate from the reference line, particularly in the upper tail, suggesting that the residuals may not follow a normal distribution. The Scale-Location Plot shows a slight upward trend, indicating possible heteroscedasticity. In addition, the Residuals vs Leverage Plot identifies a few observations with relatively high leverage or large standardized residuals, which should be further examined using Cook's Distance. HC3 robust standard errors can help improve the reliability of statistical inference, particularly when heteroscedasticity is present. Therefore, the model is useful but could be improved further.

---


Overall Model Performance:
The regression model demonstrates an excellent overall fit, with an Adjusted R-squared of 0.9188, meaning the predictors explain approximately 91.88% of the variance in patient rates. The overall model is highly significant (F-test p-value &lt; 2.2e-16), and almost all individual predictors (SIMD, DischargeRates, AgeGroup, and Sex) are significant at the 0.1% level. The residual standard error is 79.34.

However, the diagnostic plots indicate some deviations from standard assumptions. The Residuals vs Fitted plot shows a slight non-linear pattern (a curved red line) rather than random scatter, and the Q-Q plot shows slight deviations in the tails. This suggests that while the model's predictive power is very strong, there might be complex non-linear relationships or outliers within the data that could be further explored.

#Conclusion
Factors Associated with Patient Rates (PR) and Their Relationships:
The regression results indicate that all independent variables are statistically significant in relation to mental health inpatient patient rates. Specifically:

SIMD: There is a significant negative relationship（β=−0.3681,p&lt;0.001). Higher levels of socio-economic deprivation (or the specific SIMD indicator used) are associated with lower patient rates.
DischargeRates: There is a significant positive relationship (β=0.3218,p&lt;0.01). Higher discharge rates are associated with higher patient rates.
AgeGroup: Compared to the reference group (0-17 years), older age groups show significantly higher patient rates. The disparity increases with age, peaking at the 65plus group, which has a substantially higher rate (β=797.5376,p&lt;0.001).
Sex: There is a significant positive relationship for males (β=105.4133,p&lt;0.001). Specifically, males have an expected patient rate that is approximately 105.4 units higher than females (the reference group).

Government Policy Implications:
Given these findings, the Scottish Government can use this evidence to implement targeted interventions. The government should prioritize allocating mental health resources and preventative support to older adults (especially those aged 65 and over) and males, as these groups exhibit significantly higher patient rates. Furthermore, understanding the positive correlation between discharge rates and patient rates could help policymakers evaluate the effectiveness of current hospital discharge pathways and community care transitions, ensuring that high-risk demographic groups receive adequate follow-up care to reduce readmission and overall prevalence.

---
Limitations

Despite the strong predictive power of the model (R square=0.9073), this study has several limitations:

Limited Temporal Data: The dataset covers a relatively short time frame (limited number of years). This restricts the model's ability to capture long-term trends, structural breaks, or delayed effects of socioeconomic changes on mental health patient rates over time.

Omission of Other Influencing Factors: The model includes the discharge-rate gap between SIMD 1 and SIMD 5, mean discharge rates, age group, and sex. Other potentially important factors, such as healthcare resources, physical health conditions, and broader socioeconomic characteristics, are not included.
